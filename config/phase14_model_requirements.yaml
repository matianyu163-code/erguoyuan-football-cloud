schema_version: MODEL_REQUIREMENTS_V1
input_schema_version: MODEL_INPUT_BUNDLE_V1
sample_hierarchy_version: SAMPLE_HIERARCHY_V1
# Readiness is required for fit; inference requirements apply even with a valid artifact.
# Existing model fit thresholds remain in config/phase13_6_model_readiness.yaml and ModelConfig.
models:
  DIXON_COLES_V1:
    training_inputs: [HISTORICAL_RESULTS]
    inference_inputs: [FIXTURE]
