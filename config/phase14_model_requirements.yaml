    sample_levels: [DIRECT, COMPETITION]
  ELO_V1:
    training_inputs: [HISTORICAL_RESULTS, THREE_WAY_MAPPER_TRAINING]
    inference_inputs: [FIXTURE]
    prior_support: DIRECT_PLUS_COMPETITION
    sample_levels: [DIRECT, COMPETITION]
  PI_RATING_V1:
    training_inputs: [HISTORICAL_RESULTS, THREE_WAY_MAPPER_TRAINING]
    inference_inputs: [FIXTURE]
    prior_support: DIRECT_PLUS_COMPETITION
