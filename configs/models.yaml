# Starting configurations, not optimized against the test set.
defaults:
  max_goals: 10
  time_decay: 0.001
  min_matches: 40
  min_team_matches: 3
  training_window: 1095
  initial_rating: 1500.0
  k_factor: 20.0
  home_advantage: 60.0
  goal_difference_adjustment: true
  pi_learning_rate: 0.035
  pi_coupling: 0.7
hierarchical_bayes:
  development:
    chains: 2
    draws: 1500
    tune: 1500
    thin: 1
    max_rhat: 1.05
    min_ess: 100
  production:
    chains: 4
    draws: 4000
    tune: 4000
    thin: 2
    max_rhat: 1.05
    min_ess: 200
dynamic_bayes:
  development:
    dynamic_state_process: RANDOM_WALK
    dynamic_time_index: WEEKLY
    dynamic_sigma_attack: 0.08
    dynamic_sigma_defence: 0.08
    dynamic_posterior_draws: 200
    dynamic_learning_rate: 0.35
spi_like:
  goals_only:
    feature_mode: GOALS_ONLY
    baseline_goals: 1.25
    smoothing: 0.5
    learning_rate: 0.12
    season_carryover: 0.75
    mean_reversion: 0.25
    home_advantage_log_rate: 0.15
    draw_adjustment: 1.0
  goals_xg_reference:
    feature_mode: GOALS_XG
    xg_weight: 0.2
opta_xg_elo_like:
  result_weight_reference: 0.8
  xg_weight_reference: 0.2
  hierarchy_k_factor: 20.0
  hierarchy_home_advantage: 60.0
  xg_score_distribution: CORE_XG_SCORE_DISTRIBUTION_V1
  xg_max_goals: 10
  power_transform: CORE_ESTIMATED
  production:
    result_weight: 0.8
    xg_weight: 0.2
