[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "erguoyuan-football"
version = "0.1.0"
description = "二果园足球预测系统：可训练、可回测、可审计的概率预测程序"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb==1.5.6", "pydantic==2.13.5", "pytz>=2026.4,<2027",
    "penaltyblog==1.12.2", "numpy==2.3.5", "pandas==3.0.6",
    "scipy==1.17.1", "scikit-learn==1.9.1", "joblib==1.6.0",
    "pyyaml>=6.0.3,<7", "httpx==0.28.1", "beautifulsoup4>=4.15,<5",
    "xgboost>=3.2,<3.3", "catboost>=1.2.10,<1.3",
]

[project.scripts]
production-predict-probe = "erguoyuan_football.prediction.production_predict_probe:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.16,<0.17", "mypy>=2.3,<2.4", "psutil>=7.2,<8"]
desktop = ["pyinstaller>=6.16,<7", "reportlab>=4.4,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"erguoyuan_football.knowledge.entities" = ["country_aliases.json"]
"erguoyuan_football.app.input" = ["competition_prefixes.json"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests/blind_test_r3", "tests/markets", "tests/models", "tests/pit", "tests/unit"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib --basetemp=.workspace/pytest"
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "unit: package, input and contract tests",
    "fast: deterministic schema and mathematical unit tests",
    "model: deterministic model-fit and prediction tests",
    "slow: long-running Bayesian or large backtest tests",
    "integration: integration tests requiring explicit fixtures",
    "pit: point-in-time and leakage prevention tests",
    "network_live: real network access; run only explicitly with pytest -m network_live",
    "live_network: Phase 13.4 real provider smoke; run explicitly with pytest -m live_network",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
cache_dir = ".workspace/mypy"

[tool.ruff]
cache-dir = ".workspace/ruff"
extend-exclude = [".workspace"]
